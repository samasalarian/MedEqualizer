# Legacy Linux/x86_64 Python environment for HealthGAN, MedGAN, and their
# MedEqualizer augmentation/filtering stages.
# TensorFlow 1.13.1 has no supported Apple Silicon build. Do not substitute
# TensorFlow 2.x: the original implementations use tf.contrib and TF1 sessions.
#
# After creating this environment, install the restored local HealthGAN package:
#   conda activate fenv
#   python -m pip install --no-deps -e synthetic_data_generation/healthgan/synthetic_data
name: fenv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.6.15
  - pip=21.3.1
  - setuptools=58.0.4
  - pip:
      - numpy==1.19.5
      - pandas==1.1.5
      - scipy==1.5.4
      - scikit-learn==0.24.2
      - matplotlib==2.1.2
      - seaborn==0.9.0
      - openpyxl==3.0.9
      - psutil==5.8.0
      - tqdm==4.17.0
      - tensorflow==1.13.1
      - tensorflow-estimator==1.13.0
      - tensorboard==1.13.1
      - protobuf==3.19.6
      - h5py==3.1.0
      - grpcio==1.48.2
      - keras-applications==1.0.8
      - keras-preprocessing==1.1.2
